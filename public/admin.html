<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Airys — Admin</title><link rel="stylesheet" href="style.css"></head><body><header class="site-header"><a class="brand" href="index.html">AIRYS<span>✦</span></a><nav class="admin-nav"><a href="index.html">← Back to shop</a><button id="logout" class="btn btn-outline" hidden>Sign out</button></nav></header><main class="admin-main"><section id="loginPanel" class="login-card"><span class="eyebrow">ADMIN ACCESS</span><h1>Welcome back.</h1><p>Sign in with your authorized administrator account.</p><form id="loginForm"><label>Email<input name="email" type="email" required autocomplete="username"></label><label>Password<input name="password" type="password" required autocomplete="current-password"></label><button class="btn btn-primary full" type="submit">Sign in</button><p id="loginStatus" class="form-status" role="status"></p></form></section><section id="adminPanel" hidden><div class="section-heading"><div><span class="eyebrow">ORDER MANAGEMENT</span><h1>Orders dashboard</h1></div><button id="refresh" class="btn btn-outline">Refresh orders</button></div><div class="stat-row"><div class="stat"><span>Total orders</span><strong id="orderCount">—</strong></div><div class="stat"><span>Order value</span><strong id="orderValue">—</strong></div></div><div id="adminStatus" class="form-status" role="status"></div><div id="ordersList" class="orders-list"></div></section></main><script type="module" src="js/admin.js"></script></body></html>
